name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint documentation et submodules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: État des submodules
        run: git submodule status --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "#**/node_modules"
