name: submodules-sync

# Avance les pointeurs de submodules sur la tête de la branche que chacun suit
# (.gitmodules) et ouvre la PR correspondante. Hebdomadaire plutôt qu'à chaque
# merge dans un service : les quatre dépôts fusionnent plusieurs fois par jour,
# une PR par merge noierait la relecture pour des pointeurs que seuls les
# humains consomment. Déclenchable à la main avant une démo ou une livraison.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Écriture limitée à ce workflow : il pousse une branche et ouvre une PR, il ne
# touche jamais develop directement.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: submodules-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Avancer les pointeurs sur les branches suivies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Préparer l'accès SSH aux submodules
        env:
          SUBMODULE_SSH_KEY_API: ${{ secrets.SUBMODULE_SSH_KEY_API }}
          SUBMODULE_SSH_KEY_DASHBOARD: ${{ secrets.SUBMODULE_SSH_KEY_DASHBOARD }}
          SUBMODULE_SSH_KEY_PREDICT: ${{ secrets.SUBMODULE_SSH_KEY_PREDICT }}
          SUBMODULE_SSH_KEY_INFRA: ${{ secrets.SUBMODULE_SSH_KEY_INFRA }}
        run: bash .github/scripts/submodule-ssh-access.sh

      # Les pointeurs sont posés dans l'index sans cloner, puis le checkout
      # récursif prouve qu'ils se récupèrent : c'est le même contrôle que la
      # CI, joué ici parce qu'une PR ouverte avec le jeton du job ne déclenche
      # pas de workflow.
      - name: Pointer chaque submodule sur la tête de sa branche suivie
        id: bump
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/moves.md"
          for name in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}'); do
            url=$(git config -f .gitmodules "submodule.$name.url")
            branch=$(git config -f .gitmodules "submodule.$name.branch")
            old=$(git rev-parse "HEAD:$name")
            new=$(git ls-remote --exit-code "$url" "refs/heads/$branch" | cut -f1)
            git update-index --cacheinfo "160000,$new,$name"
            if [ "$old" != "$new" ]; then
              echo "- \`$name\` (\`$branch\`) : ${old:0:7} → ${new:0:7} — ${url%.git}/compare/$old...$new" >> "$RUNNER_TEMP/moves.md"
            fi
          done
          git submodule update --init --recursive
          git submodule status --recursive
          if git diff --cached --quiet; then
            echo "Pointeurs déjà à jour."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ouvrir ou mettre à jour la PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c submodules-sync
          git commit -m "Avancer les pointeurs de submodules sur les branches suivies"
          git push --force origin submodules-sync
          {
            echo "Pointeurs avancés sur la tête de la branche suivie par chaque submodule :"
            echo
            cat "$RUNNER_TEMP/moves.md"
            echo
            echo "Les nouveaux pointeurs ont été clonés par le run qui a ouvert cette PR :"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/body.md"
          if [ -z "$(gh pr list --head submodules-sync --state open --json number -q '.[0].number')" ]; then
            gh pr create --base develop --head submodules-sync \
              --title "Avancer les pointeurs de submodules" \
              --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit submodules-sync --body-file "$RUNNER_TEMP/body.md"
          fi
